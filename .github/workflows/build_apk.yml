name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # اجازه اجرای دستی با دکمه Run Workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # در صورتی که فایل gradlew در گیت نباشد، گریدل را خودکار اجرا و تنظیم میکند
    - name: Grant execute permission for gradlew (if exists)
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        else
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TMAS-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

            - name: Fix Missing Launcher Icon in Manifest
      run: |
        sed -i 's/@mipmap\/ic_launcher/@drawable\/logo3/g' app/src/main/AndroidManifest.xml
        sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml

